[package]
name = "holonet"
version = "0.1.0"
edition = "2024"

[dependencies]
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
ego-tree = "0.11"
encoding_rs = "0.8.42"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli"] }
scraper = "0.29.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2.2"
url = "2.5.8"
